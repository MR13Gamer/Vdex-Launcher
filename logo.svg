<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Top loop gradient: cyan to blue -->
    <linearGradient id="topLoop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06d6a0"/>
      <stop offset="35%" stop-color="#00d4ff"/>
      <stop offset="70%" stop-color="#4ea8fe"/>
      <stop offset="100%" stop-color="#5b6ef7"/>
    </linearGradient>
    <!-- Bottom loop gradient: blue to pink/magenta -->
    <linearGradient id="botLoop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7b5ef7"/>
      <stop offset="40%" stop-color="#c25bfa"/>
      <stop offset="75%" stop-color="#f062a8"/>
      <stop offset="100%" stop-color="#ff6b9d"/>
    </linearGradient>
    <!-- Center crossing gradient -->
    <linearGradient id="midGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ea8fe"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <!-- Small accent orb -->
    <radialGradient id="orbGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#f0abfc" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Top loop (cyan-blue): curves from center-left up and around -->
  <path d="M 48,50 C 38,38 22,18 38,10 C 54,2 68,14 72,28 C 76,42 62,50 50,50"
        fill="none" stroke="url(#topLoop)" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Bottom loop (purple-pink): curves from center-right down and around -->
  <path d="M 52,50 C 62,62 78,82 62,90 C 46,98 32,86 28,72 C 24,58 38,50 50,50"
        fill="none" stroke="url(#botLoop)" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Center crossing overlay for smooth blend -->
  <path d="M 44,46 C 47,48 50,50 53,52"
        fill="none" stroke="url(#midGrad)" stroke-width="11" stroke-linecap="round" opacity="0.7"/>

  <!-- Small bright accent orb at bottom-right of crossing -->
  <circle cx="62" cy="72" r="6" fill="url(#orbGrad)" opacity="0.85"/>
  <!-- Tiny highlight dot -->
  <circle cx="61" cy="70" r="2.5" fill="#fff" opacity="0.8"/>
</svg>
